apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: flask-k8s-app:latest  # Set to <your-dockerhub-username>/flask-k8s-app:latest if using Docker Hub
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb-service:27017/"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
            - name: MONGO_AUTH_SOURCE
              value: "admin"
          resources:
            requests:
              cpu: "200m"
              memory: "250M"
            limits:
              cpu: "500m"
              memory: "500M"
